# Publish the research blog (blog/) to GitHub Pages when it changes on main.
# One-time setup by the repository owner: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish the blog

on:
  push:
    branches: [main]
    paths: ["blog/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the page and its files
        run: |
          mkdir _site
          cp -r blog/index.html blog/css blog/js blog/assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
